<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>正在打开 why.hiwd.com</title></head>
  <body>
    <script>
      const path = window.location.pathname;
      const symbol = path.split("/").filter(Boolean)[0];
      window.location.replace(`/${symbol ? `?symbol=${encodeURIComponent(symbol)}` : ""}`);
    </script>
  </body>
</html>
