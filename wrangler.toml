name = "why-hiwd-api"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

# Worker Cron 使用 UTC。此处每 15 分钟巡检一次。
[triggers]
crons = ["*/15 * * * *"]

[[routes]]
pattern = "api.hiwd.com"
custom_domain = true

[[kv_namespaces]]
binding = "WHY_DATA"
id = "724b9a38788c4a2b82fd513420070023"

[vars]
MARKET_DATA_MODE = "live"
MOCK_SCENARIO = "quiet"
# 短期热点以逗号分隔，例如 "TICKER_A,TICKER_B"；当前启用纳斯达克 ADR SKHY。
HOT_TICKERS = "SKHY"

[observability]
enabled = true
